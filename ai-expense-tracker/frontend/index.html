<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#3b82f6',
                        secondary: '#1e293b',
                        accent: '#10b981',
                    },
                    fontFamily: {
                        sans: ['Plus Jakarta Sans', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f8fafc; }
        .glass-panel {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .scanner-line {
            width: 100%;
            height: 4px;
            background: #3b82f6;
            position: absolute;
            top: 0;
            left: 0;
            box-shadow: 0 0 10px #3b82f6;
            animation: scan 2s infinite linear;
            display: none;
        }
        @keyframes scan {
            0% { top: 0; }
            50% { top: 100%; }
            100% { top: 0; }
        }
        .loading .scanner-line { display: block; }
    </style>
</head>
<body class="text-slate-800">

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <!-- Header -->
        <header class="flex justify-between items-center mb-10">
            <div class="flex items-center gap-3">
                <div class="bg-blue-600 text-white w-12 h-12 rounded-xl flex items-center justify-center text-xl shadow-lg shadow-blue-200">
                    <i class="fas fa-wallet"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-bold text-slate-900 leading-tight">AI Expense Tracker</h1>
                    <p class="text-slate-500 text-sm">Smart Receipt OCR System</p>
                </div>
            </div>
            <div class="bg-white px-4 py-2 rounded-full border border-slate-200 shadow-sm flex items-center gap-2">
                <span class="w-2 h-2 rounded-full bg-green-500"></span>
                <span class="text-sm font-semibold text-slate-600">API Active</span>
            </div>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            
            <!-- Left Column: Upload -->
            <div class="lg:col-span-1">
                <div class="bg-white rounded-3xl p-6 shadow-xl shadow-slate-200/50 border border-slate-100">
                    <h2 class="text-lg font-bold mb-4">Upload Receipt</h2>
                    
                    <div id="dropzone" class="relative border-2 border-dashed border-slate-300 rounded-2xl p-8 text-center hover:bg-slate-50 hover:border-blue-400 transition cursor-pointer overflow-hidden group">
                        <div class="scanner-line"></div>
                        <i class="fas fa-receipt text-4xl text-slate-400 mb-4 group-hover:text-blue-500 transition"></i>
                        <h3 class="font-semibold text-slate-700 mb-1">Click or Drop Image</h3>
                        <p class="text-xs text-slate-400 mb-4">PNG, JPG up to 5MB</p>
                        
                        <input type="file" id="fileInput" class="hidden" accept="image/png, image/jpeg, image/jpg">
                        <button class="bg-slate-900 text-white text-sm px-5 py-2 rounded-full font-medium shadow hover:bg-blue-600 transition" onclick="document.getElementById('fileInput').click(); event.stopPropagation();">
                            Select Photo
                        </button>
                    </div>
                    
                    <div id="previewContainer" class="hidden mt-6 relative rounded-2xl overflow-hidden border border-slate-200">
                        <img id="imagePreview" src="" alt="Receipt Preview" class="w-full h-auto max-h-64 object-contain bg-slate-100">
                        <div id="scanOverlay" class="absolute inset-0 bg-slate-900/40 hidden flex-col items-center justify-center">
                            <i class="fas fa-circle-notch fa-spin text-white text-3xl mb-2"></i>
                            <span class="text-white text-sm font-medium">Extracting Data...</span>
                        </div>
                    </div>
                    
                    <button id="processBtn" class="w-full mt-6 bg-blue-600 text-white px-6 py-3 rounded-xl font-bold shadow-lg shadow-blue-200 hover:bg-blue-700 transition hidden flex items-center justify-center gap-2">
                        <i class="fas fa-magic"></i> Extract Expense
                    </button>
                </div>
            </div>

            <!-- Right Column: Dashboard & History -->
            <div class="lg:col-span-2 space-y-8">
                
                <!-- Stats Row -->
                <div class="grid grid-cols-2 md:grid-cols-3 gap-4">
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                        <div class="text-slate-500 text-sm font-medium mb-1">Total Expenses</div>
                        <div class="text-2xl font-bold text-slate-800" id="statTotal">$0.00</div>
                    </div>
                    <div class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100">
                        <div class="text-slate-500 text-sm font-medium mb-1">Receipts Scanned</div>
                        <div class="text-2xl font-bold text-slate-800" id="statCount">0</div>
                    </div>
                    <div class="bg-gradient-to-br from-blue-600 to-indigo-700 rounded-2xl p-6 shadow-lg text-white md:col-span-1 col-span-2">
                        <div class="text-blue-100 text-sm font-medium mb-1">Powered By</div>
                        <div class="text-xl font-bold flex items-center gap-2">
                            <i class="fas fa-brain"></i> Gemini 1.5 Flash
                        </div>
                    </div>
                </div>

                <!-- History Table -->
                <div class="bg-white rounded-3xl p-6 shadow-xl shadow-slate-200/50 border border-slate-100">
                    <div class="flex justify-between items-center mb-6">
                        <h2 class="text-lg font-bold">Recent Expenses</h2>
                        <button class="text-blue-600 text-sm font-medium hover:underline" onclick="fetchExpenses()">Refresh</button>
                    </div>
                    
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="text-slate-400 text-sm border-b border-slate-100">
                                    <th class="pb-3 font-medium">Merchant</th>
                                    <th class="pb-3 font-medium">Category</th>
                                    <th class="pb-3 font-medium">Date</th>
                                    <th class="pb-3 font-medium text-right">Amount</th>
                                </tr>
                            </thead>
                            <tbody id="expenseTableBody" class="text-sm">
                                <!-- Data will be populated here -->
                                <tr>
                                    <td colspan="4" class="py-8 text-center text-slate-400">Loading data...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Notification Toast -->
    <div id="toast" class="fixed bottom-5 right-5 bg-slate-900 text-white px-6 py-3 rounded-xl shadow-2xl transform transition-all duration-300 translate-y-20 opacity-0 flex items-center gap-3 z-50">
        <i class="fas fa-check-circle text-green-400"></i>
        <span id="toastMsg">Success</span>
    </div>

    <script src="script.js"></script>
</body>
</html>
